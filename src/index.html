<script type="module">
import { add, update, setOne, getOne, watchOne, watchSettings, getWhere, cloud, kv, ss, ACTIVE, putMedia, mediaSrc, hydrateMedia } from "./db.js";
import { esc, icon, hydrateIcons, eta, mins, orderNo, rs, num, fmtTime, fmtDate, getPos, createMap, toast, beep, onInstallable, promptInstall, initials, inArea, distKm, isOpen, hourLabel, validPhone, norm, deviceId, uaShort, getIp, otpHash, startRecording, compressImage, fitImage, trustOf, inApp, APP_VERSION, pushBack } from "./util.js";
import { t, initLang, setLang, getLang, applyLang, agoT } from "./i18n.js";
import { openChat } from "./chat.js";
import { askYes, askText, info } from "./dialog.js";
import { kycCryptoOk, sealKyc, cnicKey, cnicMask, cnicFormat, validCnic } from "./kyc.js";

const $ = (id) => document.getElementById(id);
initLang("customer");
hydrateIcons();
if (!cloud) { $("demo").hidden = false; $("gDemo").hidden = false; }
onInstallable(() => ($("installBtn").hidden = false));
try { if (inApp() || window.matchMedia("(display-mode: standalone)").matches || navigator.standalone) $("instCard").hidden = true; } catch (e) {}
$("installBtn").addEventListener("click", () => promptInstall());

const CATS = { grocery: ["cart", "c1"], fruit: ["fruit", "c7"], snack: ["snack", "c8"], food: ["food", "c3"], bakery: ["cake", "c4"], pharmacy: ["pill", "c2"], mobile: ["mobile", "c5"], other: ["package", "c6"], parcel: ["package", "c6"] };
const HOME_CATS = ["grocery", "fruit", "snack", "food", "bakery", "pharmacy", "mobile", "other"];
const catBadge = (k, s = 22) => { const [ic, c] = CATS[k] || CATS.other; return `<span class="ci ${c}">${icon(ic, s)}</span>`; };
const dev = deviceId(kv);
const J = (k, d) => { try { return JSON.parse(kv.getItem(k) || "") ?? d; } catch { return d; } };
const profile = () => J("kmd_profile", {});
const myIds = () => J("kmd_my", []);
const myCodes = () => J("kmd_otp", {});
const kycLocal = () => J("kmd_mykyc", null);

let S = null, here = null, gateMode = "ask", gateKm = "", view = "home", cat = "grocery", dest = null, curTrack = null, rating = 0;
let voice = null, photo = null, recording = null, trust = null;
let kycDoc, kycUnsub = null, kycPh = {}; // kycDoc: undefined = abhi load ho raha, null = nahi mila
const orders = new Map();
const lastStatus = new Map();
const H = 3600000;

// ---------------- KYC ki halat ----------------
// off = KYC band (ya admin ne KYC password abhi nahi banaya), none = abhi tak nahi bheji, loading, pending, approved, rejected
const kycActive = () => !!S && S.kycMode !== "off" && !!S.kycPublicKey && kycCryptoOk();
function kycState() {
  if (!kycActive()) return "off";
  const l = kycLocal();
  if (!l) return "none";
  if (l.ref !== kycWatchRef) watchKyc(); // kisi aur tab/naye data se ref badal gaya
  if (kycDoc === undefined) return "loading";
  if (!kycDoc) return "none";
  return kycDoc.status || "pending";
}
const kycDue = () => (kycDoc && (kycDoc.dueAt || kycDoc.createdAt + (S.kycHours || 24) * H)) || Date.now() + (S.kycHours || 24) * H;
const kycTime = () => "⁦" + fmtDate(kycDue()) + "⁩";
let kycWatchRef = "";
function watchKyc() {
  if (kycUnsub) { kycUnsub(); kycUnsub = null; }
  const l = kycLocal();
  kycWatchRef = l ? l.ref : "";
  kycDoc = l ? undefined : null;
  if (!l) return;
  let first = true;
  kycUnsub = watchOne("kyc", l.ref, (d) => {
    const prev = kycDoc ? kycDoc.status : null;
    kycDoc = d;
    if (!first && d && prev && prev !== d.status) { beep(); toast(t(d.status === "approved" ? "kyc_ok_toast" : d.status === "rejected" ? "kyc_rej_toast" : "kyc_pending_t")); }
    first = false;
    renderAll();
  });
}

// ---------------- security: har dafa app khulne ka record (location, IP, device) ----------------
// Fraud mark kiye gaye number/device/IP se app khule to admin ko foran alert jata hai.
async function logVisit(p) {
  try {
    const last = Number(ss.getItem("kmd_visit_ts") || 0);
    if (Date.now() - last < 20 * 60000) return;
    ss.setItem("kmd_visit_ts", String(Date.now()));
    const pr = profile(), ip = await getIp();
    const v = { device: dev, phone: pr.phone || "", name: pr.name || "", ip, lat: p ? p.lat : null, lng: p ? p.lng : null, acc: p ? p.acc : null, ua: uaShort(), ts: Date.now() };
    await add("visits", v);
    await fraudCheck(v, "fraud_seen");
  } catch (e) { console.warn(e); }
}
async function fraudCheck(v, type) {
  const lists = await Promise.all([getWhere("blocks", "value", v.device), v.phone ? getWhere("blocks", "value", v.phone) : [], v.ip ? getWhere("blocks", "value", v.ip) : []]);
  const hit = [].concat(lists[0], lists[1], lists[2]).find((b) => b.kind === "fraud");
  if (hit) await add("alerts", { type, match: hit.type, ...v, reason: hit.reason || "", seen: false, ts: Date.now() });
  return hit;
}

// ---------------- location gate ----------------
let gmapP = null;
function paintGate() {
  const m = $("gMsg");
  $("gTitle").textContent = t(gateMode === "outside" ? "gate_out_title" : "gate_title");
  $("gText").textContent = gateMode === "outside" ? t("gate_out_text", { km: gateKm, r: S ? S.radiusKm : 5.5 }) : t("gate_text");
  m.hidden = !(gateMode === "wait" || gateMode === "denied");
  m.textContent = gateMode === "wait" ? t("gate_wait") : t("gate_denied");
  $("gBtn").textContent = t(gateMode === "ask" ? "gate_btn" : "gate_retry");
  $("gBtn").disabled = gateMode === "wait";
  // Bahar wale customer ko map par dikhao ke woh daire se kitna door hai
  const showMap = gateMode === "outside" && !!here && !!S && !$("gate").hidden;
  $("gMap").hidden = !showMap;
  if (showMap) {
    if (!gmapP) gmapP = createMap($("gMap"), S, { still: true, centreLabel: t("area_centre") }).catch(() => null);
    gmapP.then((mp) => { if (mp) { mp.setArea(S); mp.you(here, t("map_you"), true); } else $("gMap").hidden = true; });
  }
}
function showGate(mode, km) {
  gateMode = mode; gateKm = km || "";
  $("gate").hidden = false; $("app").hidden = true; $("kyc").hidden = true;
  paintGate();
}
async function locate() {
  showGate("wait");
  let p;
  try { p = await getPos(); } catch { showGate("denied"); logVisit(null); return; }
  onLocated(p);
}
function onLocated(p) {
  here = p;
  if (!S) return; // settings aate hi dobara
  logVisit(p);
  if (!inArea(p, S)) { showGate("outside", distKm(p, S.center).toFixed(1)); return; }
  // Naya customer: pehle KYC (aik dafa), phir app
  if (kycState() === "none") { showKyc(); return; }
  enterApp();
}
function enterApp() {
  if (kycBack) { const r = kycBack; kycBack = null; r(); }
  $("gate").hidden = true; $("kyc").hidden = true; $("app").hidden = false;
  show(view === "home" ? "home" : view, true);
}
$("gBtn").addEventListener("click", locate);
$("gDemo").addEventListener("click", () => onLocated({ lat: S.center.lat + 0.004, lng: S.center.lng + 0.005, acc: 12 }));
$("gLang").addEventListener("click", () => switchLang());
$("lang").addEventListener("click", () => switchLang());
$("kLang").addEventListener("click", () => switchLang());
function switchLang(l) { setLang(l || (getLang() === "ur" ? "en" : "ur")); paintGate(); if (!$("kyc").hidden) showKyc(); renderAll(); }
showGate("ask");

// ---------------- KYC screen ----------------
// [hissa, naam, icon, camera, zyada se zyada pixels, zyada se zyada size]
const KP = [["front", "kyc_front", "idcard", "environment", 1000, 300000], ["back", "kyc_back", "idcard", "environment", 1000, 300000], ["selfie", "kyc_selfie", "user", "user", 640, 140000]];
function paintKycPhotos() {
  $("kPhotos").innerHTML = KP.map(([k, label, ic, cap]) => {
    const ph = kycPh[k];
    return `<div class="kslot ${ph ? "on" : ""}"><div class="kthumb">${ph ? `<img src="${esc(ph)}" alt="">` : icon(ic, 24)}</div>

// ---------------- my orders ----------------
function track(id) {
  if (orders.has(id) || lastStatus.has(id)) return;
  lastStatus.set(id, null);
  watchOne("orders", id, (o) => {
    if (!o) { orders.delete(id); renderAll(); return; }
    const prev = lastStatus.get(id);
    if (prev && prev !== o.status) { beep(); toast(orderNo(o) + " · " + t("st_" + o.status)); if (!ACTIVE.includes(o.status)) refreshTrust(); }
    if (prev === "on_the_way" && o.status === "on_the_way" && o.arrivedAt && !orders.get(id)?.arrivedAt) { beep(); toast(t("arrived_title")); }
    lastStatus.set(id, o.status);
    orders.set(id, o);
    renderAll();
  });
}

function renderBadge() {
  const n = [...orders.values()].filter((o) => ACTIVE.includes(o.status)).length;
  $("badge").hidden = !n; $("badge").textContent = n;
}
function renderList() {
  const list = [...orders.values()].sort((a, b) => b.createdAt - a.createdAt);
  const act = list.filter((o) => ACTIVE.includes(o.status)), past = list.filter((o) => !ACTIVE.includes(o.status));
  const row = (o) => `<button class="orow" type="button" data-open="${esc(o.id)}">${catBadge(o.cat || (o.type === "pickup" ? "parcel" : "other"), 20)}
    <span class="grow"><span class="row"><b class="ono">${esc(orderNo(o))}</b>${pillHtml(o)}</span><span class="it">${esc(o.items)}</span><span class="muted xs-t">${esc(t("placed_ago", { t: "\u2068" + agoT(o.createdAt) + "\u2069" }))}</span></span>
    <span class="flip">${icon("chev", 18)}</span></button>`;
  $("olist").innerHTML = (act.length ? `<div class="sec-title">${esc(t("active_label"))}</div>` + act.map(row).join("") : "") +
    (past.length ? `<div class="sec-title" style="margin-top:6px">${esc(t("past_label"))}</div>` + past.map(row).join("") : "");
  $("none").hidden = list.length > 0;
}
$("olist").addEventListener("click", (e) => { const b = e.target.closest("[data-open]"); if (b) openTrack(b.dataset.open); });

// ---------------- tracking ----------------
let tmapP = null;
function openTrack(id) { curTrack = id; rating = 0; show("track"); }
const STEPS = [["step_placed", "createdAt"], ["step_assigned", "acceptedAt"], ["step_way", "pickedAt"], ["step_done", "deliveredAt"]];
const IDX = { new: 0, accepted: 1, on_the_way: 2, delivered: 3 };
function paintTrack() {
  const o = orders.get(curTrack);
  if (!o) return;
  const active = ACTIVE.includes(o.status), rl = o.riderLoc;
  $("trNo").textContent = orderNo(o);
  $("trAgo").textContent = t("placed_ago", { t: "\u2068" + agoT(o.createdAt) + "\u2069" });
  $("trPill").innerHTML = pillHtml(o);

  // headline
  let big = "", sub = "";
  const box = $("trEta");
  box.classList.toggle("warn", o.status === "cancelled" || o.status === "failed");
  if (o.status === "new") { big = t("tk_new"); sub = t("tk_new_s"); }
  else if (o.status === "accepted") { big = t("tk_acc", { rider: o.rider }); sub = o.confirmedAt ? t("tk_conf_s") : t("tk_acc_s"); }
  else if (o.status === "on_the_way") {
    if (rl && o.dest) { const e = eta(rl, o.dest, S.speedKmh); big = t("tk_way", { min: e.min }); sub = t("tk_way_s", { km: e.km.toFixed(1), time: "\u2066" + fmtTime(Date.now() + e.min * 60000) + "\u2069" }); }
    else { big = t("tk_way_nl"); sub = t("tk_way_nl_s"); }
  } else if (o.status === "delivered") { big = t("tk_done"); sub = t("tk_done_s", { m: mins(o.createdAt, o.deliveredAt) ?? "-" }); }
  else if (o.status === "failed") { big = t("tk_failed"); sub = ""; }
  else { big = t("tk_cancel"); sub = ""; }
  $("trBig").textContent = big; $("trSub").textContent = sub; $("trSub").hidden = !sub;

  // steps
  const cur = IDX[o.status] ?? 0, showSteps = o.status !== "cancelled" && o.status !== "failed";
  $("trSteps").hidden = !showSteps;
  $("trSteps").innerHTML = STEPS.map(([k, f], i) => {
    const done = i < cur || o.status === "delivered", now = i === cur && o.status !== "delivered";
    return `<div class="step ${done ? "done" : ""} ${now ? "now" : ""}"><i>${done ? icon("check", 12) : ""}</i>${esc(t(k))}<small dir="ltr">${o[f] && (done || now) ? fmtTime(o[f]) : ""}</small></div>`;
  }).join("");

  // map
  const showMap = active && (rl || o.dest);
  $("tmap").hidden = !showMap;
  if (showMap) {
    if (!tmapP) tmapP = createMap($("tmap"), S, { controls: ["area", "full"], centreLabel: t("area_centre") }).catch(() => null);
    tmapP.then((m) => m && m.update(o.status === "new" ? null : rl, o.dest));
  }

  $("trArrive").hidden = !(o.status === "on_the_way" && o.arrivedAt);

  // delivery code
  const code = myCodes()[o.id];
  $("trCode").hidden = !active;
  $("trCodeVal").textContent = code || "----";
  $("trCode").querySelector("small").textContent = code ? t("code_text") : t("code_missing");

  // bill
  const bill = $("trBill");
  if (o.bill !== "" && o.bill != null && (o.status === "on_the_way" || o.status === "delivered" || o.status === "accepted")) {
    bill.hidden = false;
    bill.innerHTML = `<b>${esc(o.status === "delivered" ? t("paid") : t("bill_title"))}</b>
      ${o.type === "pickup" ? "" : `<div class="row"><span>${esc(t("bill_items"))}</span><span>${rs(o.bill)}</span></div>`}
      <div class="row"><span>${esc(t("bill_fee"))}</span><span>${rs(o.fee)}</span></div>
      <div class="row total"><span>${esc(t("bill_total"))}</span><span>${rs(num(o.bill) + num(o.fee))}</span></div>
      ${o.receipt || o.receiptId ? `<div class="sec-title" style="margin-top:6px">${esc(t("bill_photo"))}</div><img class="billimg" id="rcptImg" alt="${esc(t("bill_photo"))}" ${mediaSrc(o.receipt, o.receiptId)}>` : ""}
      ${o.status !== "delivered" && !o.billDisputed ? `<button class="btn ghost sm" type="button" id="billWrong">${icon("alert", 15)} ${esc(t("bill_wrong"))}</button>` : ""}`;
  } else if (o.status === "accepted" && o.type !== "pickup") {
    bill.hidden = false;
    bill.innerHTML = `<b>${esc(t("bill_title"))}</b><div class="muted sm-t">${esc(t("bill_wait"))}</div>`;
  } else bill.hidden = true;

  // customer khud batata hai kitna cash diya
  const pay = $("trPay"), amt = num(o.bill) + num(o.fee);
  const payReady = (o.status === "on_the_way" && (o.type === "pickup" || (o.bill !== "" && o.bill != null))) || o.status === "delivered";
  pay.hidden = !payReady;
  if (payReady) {
    pay.className = "paybox" + (o.custPaid ? " done" : "");
    pay.innerHTML = o.custPaid
      ? `<div class="row"><b>${icon("check", 16)} ${esc(t("pay_done", { amt: rs(o.custPaid) }))}</b></div>`
      : `<b>${esc(t("pay_title"))}</b><div class="sm-t">${esc(t("pay_q", { amt: rs(amt) }))}</div>
         <button class="btn block" type="button" data-pay="yes">${esc(t("pay_yes", { amt: rs(amt) }))}</button>
         <button class="btn sec block" type="button" data-pay="other">${esc(t("pay_other"))}</button>
         <div class="hint">${esc(t("pay_note"))}</div>`;
  }

  // rider
  const hasRider = !!o.rider && !["new", "cancelled"].includes(o.status);
  $("trRider").hidden = !hasRider;
  if (hasRider) {
    $("trAv").textContent = initials(o.rider);
    $("trRname").textContent = o.rider;
    $("trCall").href = "tel:" + (o.riderPhone || "");
    $("trCall").innerHTML = icon("phone", 18);
    $("trChat").innerHTML = icon("message", 18);
    $("trChat").hidden = !active;
  }

  $("trMeta").innerHTML = `<dt>${esc(t("d_items"))}</dt><dd>${esc(o.items || "-")}</dd>
    ${o.voice || o.voiceId ? `<dt>${esc(t("f_voice"))}</dt><dd><audio controls preload="none" ${mediaSrc(o.voice, o.voiceId)} style="max-width:100%;height:36px"></audio></dd>` : ""}
    ${o.listPhoto || o.photoId ? `<dt>${esc(t("f_photo"))}</dt><dd><img ${mediaSrc(o.listPhoto, o.photoId)} alt="" class="billimg" style="max-height:160px" data-zoom="1"></dd>` : ""}
    ${o.shop ? `<dt>${esc(t("f_shop"))}</dt><dd>${esc(o.shop)}</dd>` : ""}${o.pickup ? `<dt>${esc(t("f_pickup"))}</dt><dd>${esc(o.pickup)}</dd>` : ""}
    <dt>${esc(t("d_to"))}</dt><dd>${esc([o.area, o.address].filter(Boolean).join(", "))}</dd><dt>${esc(t("sum_pay"))}</dt><dd>${esc(t("cash"))}</dd>`;

  // rating
  const canRate = o.status === "delivered";
  $("trRate").hidden = !canRate;
  if (canRate) {
    const r = o.rating || rating;
    $("stars").innerHTML = [1, 2, 3, 4, 5].map((n) => `<button type="button" data-s="${n}" class="${n <= r ? "on" : ""}" ${o.rating ? "disabled" : ""} aria-label="${n}">${icon("star", 30)}</button>`).join("");
    $("rateBtn").hidden = !!o.rating;
    $("rateBtn").disabled = !rating;
    $("trRate").querySelector("b").textContent = o.rating ? t("rated", { n: o.rating }) : t("rate_title");
  }
  $("trReorder").hidden = active;
  $("trCancel").hidden = o.status !== "new";
  hydrateMedia($("v-track"));
}
function zoom(src) {
  const ov = document.createElement("div");
  ov.className = "modal center";
  ov.innerHTML = `<div class="sheet"><img class="receipt" alt="" src="${esc(src)}"><button class="btn sec block" type="button">${esc(t("close"))}</button></div>`;
  let release = pushBack(() => { release = null; ov.remove(); });
  ov.addEventListener("click", (ev) => { if (ev.target === ov || ev.target.closest("button")) { ov.remove(); if (release) { const r = release; release = null; r(); } } });
  document.body.appendChild(ov);
}
$("trMeta").addEventListener("click", (e) => { const i = e.target.closest("[data-zoom]"); if (i && i.getAttribute("src")) zoom(i.getAttribute("src")); });
$("trBill").addEventListener("click", async (e) => {
  const o = orders.get(curTrack);
  const ri = e.target.closest("#rcptImg");
  if (ri) return ri.getAttribute("src") && zoom(ri.getAttribute("src"));
  if (e.target.closest("#billWrong")) {
    const p = profile();
    await update("orders", o.id, { billDisputed: Date.now() });
    await add("complaints", { orderId: o.id, orderShort: orderNo(o), rider: o.rider || "", name: p.name || o.name, phone: p.phone || o.phone, device: dev, text: `Bill dispute: customer says the bill (${rs(o.bill)}) looks wrong.`, status: "open", createdAt: Date.now() });
    toast(t("bill_wrong_ok"));
  }
});
$("trPay").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-pay]");
  if (!b) return;
  const o = orders.get(curTrack), due = num(o.bill) + num(o.fee);
  let paid = due;
  if (b.dataset.pay === "other") {
    const v = await askText(t("pay_enter"), "", "Rs", t("pay_btn"));
    if (v === null || !num(v)) return;
    paid = num(v);
  }
  let loc = here;
  try { loc = await getPos(6000); } catch {}
  await update("orders", o.id, { custPaid: paid, custPaidAt: Date.now(), custPayLoc: loc ? { lat: loc.lat, lng: loc.lng, acc: Math.round(loc.acc || 0) } : null, payMismatch: paid !== due });
  toast(t("pay_done", { amt: rs(paid) }));
});
$("stars").addEventListener("click", (e) => { const b = e.target.closest("[data-s]"); if (b && !b.disabled) { rating = Number(b.dataset.s); paintTrack(); } });
$("rateBtn").addEventListener("click", async () => { if (!rating) return; await update("orders", curTrack, { rating, ratedAt: Date.now() }); toast(t("rate_thanks")); });
$("trChat").addEventListener("click", () => { const o = orders.get(curTrack); openChat({ orderId: o.id, role: "customer", name: o.name, title: o.rider, subtitle: orderNo(o) }); });
$("trCancel").addEventListener("click", async () => {
  const o = orders.get(curTrack);
  if (o.status !== "new") return;
  if (await askYes(t("cancel_q"), t("cancel_order"), true)) { await update("orders", o.id, { status: "cancelled", cancelledAt: Date.now(), cancelledBy: "customer" }); toast(t("cancelled_ok")); }
});
$("trReorder").addEventListener("click", () => { const o = orders.get(curTrack); openNew(o.cat || (o.type === "pickup" ? "parcel" : "other"), o); });
$("trReport").addEventListener("click", () => { show("account"); $("corder").value = curTrack; $("ctext").focus(); });

// ---------------- account ----------------
// Customer ka apna darja (pichle orders se)
async function refreshTrust() {
  const p = profile();
  if (!validPhone(p.phone)) { trust = null; return; }
  try { trust = trustOf(await getWhere("orders", "phone", norm(p.phone)), p.phone, dev); renderAll(); } catch {}
}
function renderAccount() {
  const p = profile();
  const tr = trust;
  $("trustCard").innerHTML = `<div class="ei">${icon("award", 22)}</div><div class="grow"><div class="muted xs-t">${esc(t("trust_title"))}</div>
    <b>${esc(t("trust_" + (tr ? tr.level : "new")))}</b>
    <div class="trustline">${tr ? esc(t("trust_stats", { d: tr.delivered, c: tr.cancelled, f: tr.failed })) : ""}${tr && tr.avgWait != null ? " · " + esc(t("trust_wait", { m: tr.avgWait })) : ""}</div>
    <div class="hint" style="margin-top:4px">${esc(t("trust_tip"))}</div></div>`;
  // KYC card
  const st = kycState(), kl = kycLocal();
  const shown = st !== "off" || !!kl;
  $("kycCard").hidden = !shown;
  if (shown) {
    const lab = st === "off" || st === "loading" ? (kycDoc ? "kyc_st_" + (kycDoc.status || "pending") : kl ? "kyc_st_pending" : "kyc_st_none") : "kyc_st_" + st;
    $("kycCard").innerHTML = `<div class="ei" style="${st === "approved" ? "" : st === "rejected" ? "background:var(--red-soft);color:var(--red)" : "background:var(--amber-soft);color:var(--amber)"}">${icon("idcard", 22)}</div>
      <div class="grow"><div class="muted xs-t">${esc(t("kyc_card"))}</div><b>${esc(t(lab))}</b>
      ${kl ? `<div class="trustline"><bdi dir="ltr">${esc(kl.mask || "")}</bdi> · <bdi dir="ltr">${esc(kl.phone)}</bdi> · ${esc(t("kyc_sent_at", { t: agoT(kl.at) }))}</div>` : ""}
      ${st === "pending" ? `<div class="hint" style="margin-top:4px">${esc(t(S.kycMode === "allow" ? "kyc_pending_allow" : "kyc_pending_s", { time: kycTime() }))}</div>` : ""}
      ${st === "none" || st === "rejected" ? `<div style="margin-top:8px"><button class="btn sm" type="button" data-kyc="start">${esc(t(st === "rejected" ? "kyc_again" : "kyc_start"))}</button></div>`
        : st === "approved" ? `<div style="margin-top:6px"><button class="btn ghost sm" type="button" data-kyc="other" style="padding:0;min-height:30px">${esc(t("kyc_verify_other"))}</button></div>` : ""}</div>`;
  }
  $("verTxt").textContent = t("app_version", { v: APP_VERSION.indexOf("__") === 0 ? "dev" : APP_VERSION });
  if (document.activeElement?.closest?.("#pform")) return;
  const lockPhone = !!kl && st !== "off";
  $("pname").value = p.name || ""; $("pphone").value = lockPhone ? kl.phone : p.phone || "";
  $("pphone").readOnly = lockPhone;
  fillAreas($("parea"), p.area || ""); $("paddress").value = p.address || "";
  document.querySelectorAll("[data-l]").forEach((b) => b.classList.toggle("on", b.dataset.l === getLang()));
  $("hoursTxt").textContent = t("help_text") + " " + t("hours", { from: hourLabel(S.openFrom), to: hourLabel(S.openTo) });
  const sel = $("corder"), cur = sel.value;
  sel.innerHTML = `<option value="">${esc(t("cmp_general"))}</option>` + [...orders.values()].sort((a, b) => b.createdAt - a.createdAt).map((o) => `<option value="${esc(o.id)}">${esc(orderNo(o))} · ${esc(o.items.slice(0, 26))}</option>`).join("");
  sel.value = cur;
}
document.querySelectorAll("[data-l]").forEach((b) => b.addEventListener("click", () => switchLang(b.dataset.l)));
$("kycCard").addEventListener("click", (e) => { const b = e.target.closest("[data-kyc]"); if (b) showKyc(b.dataset.kyc === "other"); });
$("pform").addEventListener("submit", (e) => {
  e.preventDefault();
  const kl = kycLocal();
  const phone = kl && kycState() !== "off" ? kl.phone : norm($("pphone").value);
  if (phone && !validPhone(phone)) { toast(t("e_phone")); return; }
  const a = $("parea").value;
  kv.setItem("kmd_profile", JSON.stringify({ name: $("pname").value.trim(), phone, area: a === "__other" ? "Other" : a, address: $("paddress").value.trim() }));
  document.activeElement?.blur();
  toast(t("saved")); renderAll();
});
$("cform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const p = profile(), o = orders.get($("corder").value);
  try {
    await add("complaints", { orderId: o?.id || "", orderShort: o ? orderNo(o) : "", rider: o?.rider || "", name: p.name || o?.name || "Customer", phone: p.phone || o?.phone || "", device: dev, text: $("ctext").value.trim(), status: "open", createdAt: Date.now() });
    $("ctext").value = "";
    toast(t("cmp_ok"));
  } catch { toast(t("cmp_fail")); }
});

// ---------------- settings (sab functions ke baad, taake pehli render par sab tayyar ho) ----------------
watchKyc();
watchSettings((s) => {
  S = s;
  $("brandName").textContent = s.appName;
  document.title = s.appName;
  $("supCall").href = "tel:" + s.supportPhone;
  $("supWa").href = "https://wa.me/" + s.supportWhatsapp;
  if (here && $("app").hidden && $("kyc").hidden && gateMode !== "outside") onLocated(here);
  else if (here && gateMode === "outside" && !$("gate").hidden && inArea(here, s)) onLocated(here); // daira bara hua to andar aa jao
  else if (!$("gate").hidden) paintGate();
  renderAll();
});
refreshTrust();
// pehle se ijazat ho to khud hi location le lo
try { navigator.permissions?.query({ name: "geolocation" }).then((r) => { if (r.state === "granted") locate(); }).catch(() => {}); } catch {}

setInterval(() => { if (!$("app").hidden) { renderList(); if (view === "track") paintTrack(); } }, 30000);
if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !inApp()) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
