name: Build Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, rider]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build ${{ matrix.app }} APK
        run: bash scripts/build-apk.sh ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: KotMomin-${{ matrix.app }}-apk
          path: out/*.apk
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true
      - name: Save APKs to the apk-builds branch
        run: |
          set -e
          ls -la apks
          mkdir site && cd site
          git init -q
          git checkout -q -b apk-builds
          cp ../apks/*.apk .
          echo "Built from ${GITHUB_SHA} on $(date -u)" > BUILD-INFO.txt
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "APK build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
