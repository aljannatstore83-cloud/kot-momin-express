name: Build Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, rider]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build ${{ matrix.app }} APK
        run: bash scripts/build-apk.sh ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: KotMomin-${{ matrix.app }}-apk
          path: out/*.apk
          retention-days: 30
